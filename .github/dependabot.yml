# Keeps dependencies current. Every version in requirements-dev.txt and every
# action in .github/workflows is pinned, so updates arrive as pull requests that
# CI checks before anyone merges them. (The mdBook tools are pinned in
# scripts/install_tools.py, which Dependabot cannot read: upgrade them by hand.)
version: 2
updates:
  # Python packages in requirements-dev.txt.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly

  # The actions used in .github/workflows/site.yml.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
