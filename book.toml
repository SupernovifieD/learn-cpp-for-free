# Configuration of the book. The table of contents is docs/SUMMARY.md.
# Reference: https://rust-lang.github.io/mdBook/format/configuration/index.html

[book]
title = "The C++ Book"
description = "A free, open-source book for learning modern C++."
authors = ["Yasin Ghasemi", "The C++ Book contributors"]
language = "en"
src = "docs"

[build]
build-dir = "book"
# A page that SUMMARY.md lists but that does not exist is an error, not a new empty file.
create-missing = false
# `mdbook serve` rebuilds when these change, too.
extra-watch-dirs = ["examples", "theme", "scripts"]

# Labeled code blocks, the extra callout kinds and tabs (see scripts/mdbook_cppbook.py).
[preprocessor.cppbook]
command = "python3 scripts/mdbook_cppbook.py"

# Turns ```mermaid fences into diagrams, drawn in the browser by theme/mermaid.min.js.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# The book is published at https://supernovified.github.io/learn-cpp-for-free/
site-url = "/learn-cpp-for-free/"
git-repository-url = "https://github.com/SupernovifieD/learn-cpp-for-free"
edit-url-template = "https://github.com/SupernovifieD/learn-cpp-for-free/edit/main/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
# Chapter 0 comes first, so the numbers are written in SUMMARY.md instead of counted from 1.
no-section-label = true
additional-css = ["theme/cppbook.css"]
additional-js = ["theme/cppbook.js", "theme/mermaid.min.js", "theme/mermaid-init.js"]

# The run button belongs to Rust code, and this book has none.
[output.html.playground]
runnable = false

# The addresses that pages had before the book moved to mdBook. Each one becomes a small page that
# sends the reader to the new address. The home page and the chapter index kept their addresses.
[output.html.redirect]
"/conventions/index.html" = "../conventions.html"
"/ch00-getting-started/01-introduction-to-these-tutorials/index.html" = "../01-introduction-to-these-tutorials.html"
"/ch00-getting-started/02-programs-and-programming-languages/index.html" = "../02-programs-and-programming-languages.html"
"/ch00-getting-started/03-introduction-to-c-and-cpp/index.html" = "../03-introduction-to-c-and-cpp.html"
"/ch00-getting-started/04-introduction-to-cpp-development/index.html" = "../04-introduction-to-cpp-development.html"
"/ch00-getting-started/05-compiler-linker-and-libraries/index.html" = "../05-compiler-linker-and-libraries.html"
"/ch00-getting-started/06-installing-an-ide/index.html" = "../06-installing-an-ide.html"
"/ch00-getting-started/07-compiling-your-first-program/index.html" = "../07-compiling-your-first-program.html"
"/ch00-getting-started/08-common-cpp-problems/index.html" = "../08-common-cpp-problems.html"
"/ch00-getting-started/09-build-configurations/index.html" = "../09-build-configurations.html"
"/ch00-getting-started/10-compiler-extensions/index.html" = "../10-compiler-extensions.html"
"/ch00-getting-started/11-warning-and-error-levels/index.html" = "../11-warning-and-error-levels.html"
"/ch00-getting-started/12-choosing-a-language-standard/index.html" = "../12-choosing-a-language-standard.html"
"/ch00-getting-started/13-what-language-standard-is-my-compiler-using/index.html" = "../13-what-language-standard-is-my-compiler-using.html"
