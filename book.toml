# Configuration of the book. The table of contents is docs/SUMMARY.md.
# Reference: https://rust-lang.github.io/mdBook/format/configuration/index.html

[book]
title = "The C++ Book"
description = "A free, open-source book for learning modern C++."
authors = ["Yasin Ghasemi", "The C++ Book contributors"]
language = "en"
src = "docs"

[build]
build-dir = "book"
# A page that SUMMARY.md lists but that does not exist is an error, not a new empty file.
create-missing = false
# `mdbook serve` rebuilds when these change, too.
extra-watch-dirs = ["examples", "theme", "scripts"]

# Labeled code blocks, the extra callout kinds and tabs (see scripts/mdbook_cppbook.py).
[preprocessor.cppbook]
command = "python3 scripts/mdbook_cppbook.py"

# Turns ```mermaid fences into diagrams, drawn in the browser by theme/mermaid.min.js.
[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
# The book is published at https://supernovified.github.io/learn-cpp-for-free/
site-url = "/learn-cpp-for-free/"
git-repository-url = "https://github.com/SupernovifieD/learn-cpp-for-free"
edit-url-template = "https://github.com/SupernovifieD/learn-cpp-for-free/edit/main/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
# Chapter 0 comes first, so the numbers are written in SUMMARY.md instead of counted from 1.
no-section-label = true
additional-css = ["theme/cppbook.css"]
additional-js = ["theme/cppbook.js", "theme/mermaid.min.js", "theme/mermaid-init.js"]

# The run button belongs to Rust code, and this book has none.
[output.html.playground]
runnable = false
